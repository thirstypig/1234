<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Light-night toggle</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:var(--background)}</style>
</head>
<body>
<div class="nb-page"><div class="nb-spec"><div class="nb-state-grid"><div class="nb-state"><p class="nb-spec-label">Default (day)</p><button type="button" class="nb-toggle " data-nb-theme data-day="Day" data-night="Night" aria-pressed="false"><span class="nb-emoji" aria-hidden="true">🌙</span><span data-l>Night</span></button></div><div class="nb-state"><p class="nb-spec-label">Hover</p><button type="button" class="nb-toggle is-hover" data-nb-theme data-day="Day" data-night="Night" aria-pressed="false"><span class="nb-emoji" aria-hidden="true">🌙</span><span data-l>Night</span></button></div><div class="nb-state"><p class="nb-spec-label">Pressed</p><button type="button" class="nb-toggle is-pressed" data-nb-theme data-day="Day" data-night="Night" aria-pressed="false"><span class="nb-emoji" aria-hidden="true">🌙</span><span data-l>Night</span></button></div><div class="nb-state"><p class="nb-spec-label">Icon-only (header)</p><button type="button" class="nb-toggle nb-toggle--icon " data-nb-theme data-day="Day" data-night="Night" aria-pressed="false" aria-label="Night / Day"><span class="nb-emoji" aria-hidden="true">🌙</span></button></div><div class="nb-state"><p class="nb-spec-label">繁體</p><div lang="zh-Hant"><button type="button" class="nb-toggle " data-nb-theme data-day="日間" data-night="夜間" aria-pressed="false"><span class="nb-emoji" aria-hidden="true">🌙</span><span data-l>夜間</span></button></div></div></div></div></div>
<script>document.querySelectorAll('[data-nb-theme]').forEach(function(b){b.addEventListener('click',function(){var r=document.documentElement,n=r.getAttribute('data-theme')==='night'?'day':'night';r.setAttribute('data-theme',n);document.querySelectorAll('[data-nb-theme]').forEach(function(x){x.setAttribute('aria-pressed',n==='night');var l=x.querySelector('[data-l]');if(l)l.textContent=n==='night'?x.dataset.day:x.dataset.night;var i=x.querySelector('.nb-emoji');if(i)i.textContent=n==='night'?'☀️':'🌙';});});});</script>
<script type="module" src="/_review/inject.js"></script></body>
</html>
